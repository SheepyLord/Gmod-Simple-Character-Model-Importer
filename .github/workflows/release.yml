name: Release Windows executables

# Builds the shipping variants and attaches them to a GitHub Release.
#
# Triggered by pushing a release tag (the repo's convention is Release1,
# Release2, ... Release17) or from the Actions tab against an existing tag.
# A tag push builds both variants; a manual run can skip the without-Blender
# one. The release is created as a DRAFT so nothing is announced until you
# review the assets and press Publish.

on:
  push:
    tags:
      - "Release*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to"
        required: true
        type: string
      build_no_blender:
        description: "Build the without-Blender variant"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release assets
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # `inputs` is null on a tag push, so the tag and the enabled variants are
      # resolved once here.
      - name: Resolve tag and variants
        id: cfg
        shell: bash
        run: |
          echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "no_blender=${{ inputs.build_no_blender }}" >> "$GITHUB_OUTPUT"
          else
            echo "no_blender=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.cfg.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      # The with-Blender build bundles this zip; the script verifies its SHA256
      # against build_assets_manifest.json before use.
      - name: Download and verify the Blender build asset
        shell: powershell
        run: ./scripts/download_build_assets.ps1

      # Built first, while the Blender zip is present at the repo root.
      - name: Build with-Blender executable
        shell: powershell
        run: ./tools/build_mmd_character_importer_exe.ps1 -Python python

      - name: Build without-Blender executable
        if: steps.cfg.outputs.no_blender == 'true'
        shell: powershell
        run: ./tools/build_mmd_character_importer_exe_no_blender.ps1 -Python python

      - name: Summarize release payload
        shell: powershell
        run: |
          Get-ChildItem release -Recurse -File |
            Select-Object @{n = "File"; e = { $_.Name } },
                          @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 2) } } |
            Sort-Object MB -Descending | Format-Table -AutoSize | Out-String -Width 200

      # gh is preinstalled on GitHub runners, so no third-party action is needed.
      - name: Create draft release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cfg.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be added to it."
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

      # Release assets download as raw files (no zip wrapper), so the RUN_ME and
      # dependency manifest ship alongside the executables here.
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cfg.outputs.tag }}
        run: gh release upload "$TAG" release/*.exe release/*.txt release/*.json --clobber

      # Safety net if the release upload fails; executables only, stored as-is.
      - name: Upload executable artifact (backup copy)
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.cfg.outputs.tag }}
          path: release/*.exe
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
